name: Build OpenWrt 18.06

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y build-essential libncurses5-dev libncursesw5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: Download Image Builder 18.06.9
      run: |
        wget https://openwrt.org
        tar -f openwrt-imagebuilder-18.06.9-ar71xx-generic.Linux-x86_64.tar.xz -x
        mv openwrt-imagebuilder-18.06.9-ar71xx-generic.Linux-x86_64 openwrt

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        make image PROFILE=TLWR741 PACKAGES="luci luci-app-openvpn openvpn-mbedtls kmod-tun -ppp -ppp-mod-pppoe -kmod-ppp -kmod-pppoe -kmod-ath9k -wpad-mini -hostapd-common -luci-proto-ipv6 -odhcpd-ipv6only" OPKG_FLAGS="--force-depends"
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v2
      if: always()
      with:
        name: OpenWrt_18.06_firmware
        path: openwrt/bin/targets/ar71xx/generic/

